<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — BMI+ Smart Wellness Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">
  <!-- Public Header -->
  <header class="public-header">
    <div class="container public-nav">
      <a href="index.html" class="brand-logo">
        <span>🌱 BMI<span class="brand-plus">+</span></span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
      </div>
    </div>
  </header>

  <!-- Register Form Card -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge">🌟 Start Your Wellness Journey</div>
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Start your personalized wellness journey.</p>
      </div>

      <div id="auth-alert" class="form-alert"></div>

      <form id="register-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Alex Johnson" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="alex@example.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="input-password-wrapper">
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required />
            <button type="button" class="btn-toggle-password" title="Show/Hide Password">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <div class="input-password-wrapper">
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Repeat your password" required />
            <button type="button" class="btn-toggle-password" title="Show/Hide Password">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full" style="margin-top: 1rem;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" style="font-weight: 700;">Login</a>
        <div>
          <a href="index.html" class="auth-back-link">← Back to Home</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
